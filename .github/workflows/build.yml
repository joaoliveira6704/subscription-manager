# Native builds from a clean `expo prebuild`. Reused by the CI and nightly workflows.
# Android: a release APK signed with the template's debug keystore, so it installs on any device.
# iOS: an unsigned simulator build (a device build needs an Apple Developer account).
name: Build

on:
  workflow_call:
    inputs:
      retention-days:
        description: How long to keep the build artifacts.
        type: number
        default: 7

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Render the app icon and splash from the SVG source
        run: bun run icons

      - name: Generate the Android project
        run: bunx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  ios:
    name: iOS simulator app
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # CocoaPods crashes with a non-UTF-8 locale.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.json') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Render the app icon and splash from the SVG source
        run: bun run icons

      - name: Generate the iOS project (runs pod install)
        run: bunx expo prebuild --platform ios --clean

      - name: Build for the simulator
        run: |
          set -o pipefail
          workspaces=(ios/*.xcworkspace)
          workspace=${workspaces[0]}
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 100

      - name: Zip the app
        run: |
          apps=(build/Build/Products/Release-iphonesimulator/*.app)
          app=${apps[0]}
          ditto -c -k --keepParent "$app" ios-simulator-app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios-simulator-app.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
